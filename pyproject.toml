[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "suomi-skill"
version = "0.1.0"
description = "A writing skill and a checker that make coding agents write natural Finnish."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
suomi-slop = "suomi_slop.cli:main"

[tool.setuptools.packages.find]
include = ["suomi_slop*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S103", "S105", "S106", "S108", "S603", "S607"]

[tool.pytest.ini_options]
addopts = "-ra"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.0"]
